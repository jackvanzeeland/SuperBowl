<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Admin · CSV to submissions.json</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #000;
        min-height: 100vh;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: linear-gradient(
          125deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        z-index: -2;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            circle at 20% 50%,
            rgba(120, 119, 198, 0.1),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(255, 119, 48, 0.1),
            transparent 50%
          );
        z-index: -1;
        animation: float 20s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .container {
        max-width: 720px;
        width: 100%;
        padding: 24px;
      }

      .card {
        background: rgba(15, 15, 15, 0.9);
        border: 2px solid rgba(255, 119, 48, 0.3);
        border-radius: 20px;
        padding: 40px 30px;
        backdrop-filter: blur(20px);
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }

      .title {
        font-size: 2.5rem;
        font-weight: 900;
        letter-spacing: -2px;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #fff, #888);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-transform: uppercase;
      }

      .subtitle {
        color: #ff7730;
        font-size: 1rem;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 30px;
        font-weight: 700;
      }

      .upload-box {
        border: 2px dashed rgba(255, 119, 48, 0.4);
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 25px;
        transition: all 0.3s;
      }

      .upload-box:hover {
        border-color: #ff7730;
        background: rgba(255, 119, 48, 0.05);
      }

      input[type="file"] {
        color: #fff;
        font-size: 1rem;
      }

      .button {
        display: inline-block;
        margin-top: 25px;
        padding: 14px 30px;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #000;
        background: linear-gradient(135deg, #ff7730, #ff5500);
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .button:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(255, 119, 48, 0.4);
      }

      pre {
        margin-top: 30px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 12px;
        max-height: 300px;
        overflow: auto;
        text-align: left;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.85);
      }

      .footer {
        margin-top: 20px;
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.4);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="title">CSV Converter</div>
        <div class="subtitle">Admin Tool · submissions.json</div>

        <div class="upload-box">
          <input type="file" id="fileInput" accept=".csv" />
        </div>

        <button class="button" onclick="handleFile()">
          Convert & Download
        </button>

        <pre id="preview">// JSON preview will appear here</pre>

        <div class="footer">Super Bowl LX · Internal Utilities</div>
      </div>
    </div>

    <script>
      function parseCSV(csv) {
        const lines = csv.trim().split(/\r?\n/);
        const headers = lines[0]
          .split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
          .map((h) => h.replace(/^"|"$/g, ""));

        return lines.slice(1).map((line) => {
          const values = line
            .split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/)
            .map((v) => v.replace(/^"|"$/g, "").replace(/""/g, '"'));

          return Object.fromEntries(headers.map((h, i) => [h, values[i]]));
        });
      }

      function handleFile() {
        const file = document.getElementById("fileInput").files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const rows = parseCSV(e.target.result);

          const submissions = rows.map((row) => {
            const rawAnswers = JSON.parse(row.answers);

            const answers = rawAnswers.map((item) => {
              const m = item.M;
              return {
                id: Number(m.id.N),
                question: m.question.S,
                answer: m.answer.S,
                confidence: Number(m.confidence.N),
              };
            });

            return {
              id: row.id,
              name: row.name,
              paymentConfirmed: row.paymentConfirmed === "true",
              submissionTime: row.submissionTime,
              answers,
            };
          });

          const json = JSON.stringify(submissions, null, 2);
          document.getElementById("preview").textContent = json;
          download(json, "submissions.json");
        };

        reader.readAsText(file);
      }

      function download(content, filename) {
        const blob = new Blob([content], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }
    </script>
  </body>
</html>
